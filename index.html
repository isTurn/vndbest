<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <title>VNDB</title>
    <!-- 提前与 VNDB 建立 TLS 连接，减少首屏图片/接口的握手延迟（图片域与 API 域同属 vndb.org） -->
    <!-- 图片走普通 <img>（no-cors）请求，preconnect 不能带 crossorigin，
         否则会另建一条 CORS 连接、图片仍需重新握手，等于白连两次。 -->
    <link rel="preconnect" href="https://t.vndb.org" />
    <link rel="dns-prefetch" href="https://t.vndb.org" />
    <link rel="preconnect" href="https://api.vndb.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.vndb.org" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
