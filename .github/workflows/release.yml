name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.4），留空则使用 package.json 中的版本'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # @capacitor/cli 8.x 要求 Node >= 22
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate bundled translator script
        run: node scripts/build-vndb-translator.cjs

      - name: Build web app
        run: npm run build

      # ubuntu-latest 自带 Android SDK；android-actions/setup-android@v3 会尝试安装
      # 已被 SDK 移除的 "tools" 包而失败，因此直接用预装 SDK + sdkmanager 补包。
      - name: Install Android SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      # 必须用 cap sync：它会生成 capacitor.plugins.json 并注册原生插件
      # （CookieKeeper / InAppBrowser）。手工拷贝 dist/ 会导致插件未注册、功能失效。
      - name: Sync web assets and native plugins
        run: npx cap sync android

      - name: Verify native plugins registered
        run: |
          set -e
          echo "=== capacitor.plugins.json ==="
          cat android/app/src/main/assets/capacitor.plugins.json
          # npm 插件由 cap sync 写入 capacitor.plugins.json
          grep -q "inappbrowser" android/app/src/main/assets/capacitor.plugins.json
          echo "InAppBrowser plugin OK"
          # CookieKeeper 是工程内手写插件，由 MainActivity 手动注册，不在此文件中
          grep -q "CookieKeeperPlugin" android/app/src/main/java/com/vndb/MainActivity.java
          echo "CookieKeeper plugin OK"
          test -f android/app/src/main/assets/public/vndb-translator.js
          echo "translator script OK"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            # workflow_dispatch 无 tag 时退回 package.json 版本
            if [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ] || [ -z "$VERSION" ]; then
              VERSION=$(node -p "require('./package.json').version")
            fi
          fi
          # versionCode 由语义化版本推导，保证单调递增（1.0.4 -> 10004）
          CODE=$(node -e "
            const v='$VERSION'.split('.').map(n=>parseInt(n,10)||0);
            const [a=0,b=0,c=0]=v;
            process.stdout.write(String(a*10000+b*100+c));
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (versionCode $CODE)"

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Using release keystore from secrets"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，release APK 将使用 debug keystore 签名"
          fi

      - name: Build APK (Release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VNDB_VERSION_NAME: ${{ steps.version.outputs.version }}
          VNDB_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename and verify APK
        id: find-apk
        run: |
          set -e
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          OUT="vndbest-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$OUT"
          ls -l "$OUT"
          # 确认已签名（未签名 APK 无法安装）
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT"
          else
            echo "::warning::apksigner not found, skipping signature verification"
          fi
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vndbest-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VNDBest ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            ${{ steps.find-apk.outputs.apk_path }}
