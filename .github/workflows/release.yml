name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.4），留空则使用 package.json 中的版本'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # @capacitor/cli 8.x 要求 Node >= 22
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate bundled translator script
        run: node scripts/build-vndb-translator.cjs

      # 内置浏览器的工具栏按钮需要 @capgo/inappbrowser 的两处小补丁，
      # npm ci 的 postinstall 已经跑过，这里再跑一次确认（幂等）。
      - name: Patch @capgo/inappbrowser
        run: node scripts/patch-inappbrowser.cjs

      - name: Build web app
        run: npm run build

      # ubuntu-latest 自带 Android SDK；android-actions/setup-android@v3 会尝试安装
      # 已被 SDK 移除的 "tools" 包而失败，因此直接用预装 SDK + sdkmanager 补包。
      - name: Install Android SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      # 必须用 cap sync：它会生成 capacitor.plugins.json 并注册原生插件
      # （CookieKeeper / InAppBrowser）。手工拷贝 dist/ 会导致插件未注册、功能失效。
      - name: Sync web assets and native plugins
        run: npx cap sync android

      - name: Verify native plugins registered
        run: |
          set -e
          echo "=== capacitor.plugins.json ==="
          cat android/app/src/main/assets/capacitor.plugins.json
          # npm 插件由 cap sync 写入 capacitor.plugins.json
          grep -q "inappbrowser" android/app/src/main/assets/capacitor.plugins.json
          echo "InAppBrowser plugin OK"
          # CookieKeeper 是工程内手写插件，由 MainActivity 手动注册，不在此文件中
          grep -q "CookieKeeperPlugin" android/app/src/main/java/com/vndb/MainActivity.java
          echo "CookieKeeper plugin OK"
          test -f android/app/src/main/assets/public/vndb-translator.js
          echo "translator script OK"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            # workflow_dispatch 无 tag 时退回 package.json 版本
            if [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ] || [ -z "$VERSION" ]; then
              VERSION=$(node -p "require('./package.json').version")
            fi
          fi
          # versionCode 由语义化版本推导，保证单调递增（1.0.4 -> 10004）
          CODE=$(node -e "
            const v='$VERSION'.split('.').map(n=>parseInt(n,10)||0);
            const [a=0,b=0,c=0]=v;
            process.stdout.write(String(a*10000+b*100+c));
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (versionCode $CODE)"

      # 签名固定为仓库内置的 android/app/debug.keystore：
      # 1) 校验文件存在并打印证书指纹（写入日志，便于和本地包比对）
      # 2) 通过 ANDROID_KEYSTORE_PATH 显式指向它（走 signingConfigs.release 分支），
      #    不依赖 runner 上 ~/.android/debug.keystore 这种每台机器都不同的密钥。
      - name: Verify bundled signing keystore
        run: |
          set -e
          KS="$GITHUB_WORKSPACE/android/app/debug.keystore"
          test -f "$KS" || { echo "::error::缺少 android/app/debug.keystore"; exit 1; }
          echo "bundled debug.keystore OK ($(wc -c < "$KS") bytes)"
          echo "ANDROID_KEYSTORE_PATH in env: ${ANDROID_KEYSTORE_PATH:-<unset>}"
          "$JAVA_HOME/bin/keytool" -list -v -keystore "$KS" -storepass android \
            | grep -E "Alias name|SHA-256|SHA-1|Owner:" || true

      - name: Build APK (Release)
        working-directory: android
        env:
          # 显式指向仓库内置 keystore，签名因此与本地构建完全一致
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: 'android'
          ANDROID_KEY_ALIAS: 'androiddebugkey'
          ANDROID_KEY_PASSWORD: 'android'
          VNDB_VERSION_NAME: ${{ steps.version.outputs.version }}
          VNDB_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew :app:signingReport --console=plain
          ./gradlew assembleRelease

      - name: Rename and verify APK
        id: find-apk
        run: |
          set -e
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          OUT="vndb-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$OUT"
          ls -l "$OUT"
          # 确认已签名（未签名 APK 无法安装），并强制校验用的是仓库内置 keystore：
          # 证书 SHA-256 必须等于 android/app/debug.keystore 的指纹，否则直接失败，
          # 避免再次发出与本地签名不一致、无法覆盖安装的包。
          EXPECTED_SHA256="d4a228ca12c80b14860780cc8ae58ee82c4ff90d85189d498bcc8e80d74ef76e"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT"
            ACTUAL=$("$APKSIGNER" verify --print-certs "$OUT" \
              | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
            echo "APK cert SHA-256: $ACTUAL"
            echo "Expected        : $EXPECTED_SHA256"
            if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
              echo "::error::APK 签名不是仓库内置 keystore（实际 $ACTUAL）"
              printf 'MISMATCH\nactual=%s\nexpected=%s\n' "$ACTUAL" "$EXPECTED_SHA256" > signature.txt
              exit 1
            fi
            echo "Signature matches bundled keystore OK"
            printf 'OK\nactual=%s\nexpected=%s\n' "$ACTUAL" "$EXPECTED_SHA256" > signature.txt
          else
            echo "::warning::apksigner not found, skipping signature verification"
            printf 'UNKNOWN\n' > signature.txt
          fi
          cat signature.txt
          echo "signature_file=signature.txt" >> "$GITHUB_OUTPUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vndbest-apk
          path: |
            ${{ steps.find-apk.outputs.apk_path }}
            ${{ steps.find-apk.outputs.signature_file }}
          retention-days: 14

      # 发布说明直接用 body_path 让 action 自己读文件，不再经 $GITHUB_OUTPUT 中转：
      # 之前用多行 heredoc 写 output，一旦 output 为空，action 会退回「保留已有 release 的正文」，
      # 于是 release 被更新成旧文案却仍然报 success（v1.0.10 就这样丢过一次正文）。
      - name: Resolve release notes
        id: notes
        run: |
          FILE="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$FILE" ]; then
            echo "Using hand-written notes: $FILE"
            echo "body_path=$FILE" >> "$GITHUB_OUTPUT"
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $FILE, will fall back to auto-generated notes"
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VNDB ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: ${{ steps.notes.outputs.has_body != 'true' }}
          files: |
            ${{ steps.find-apk.outputs.apk_path }}

      # action 报 success 不代表正文真的写进去了（见上），这里回查一次 API：
      # 正文长度明显短于发布说明文件就判失败，避免又发一个只有旧文案的 release。
      - name: Verify release body
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          BODY_LEN=$(gh release view "$TAG" --json body -q '.body | length')
          echo "Release body length: $BODY_LEN (characters)"
          FILE="docs/release-notes/${TAG#v}.md"
          if [ -f "$FILE" ]; then
            # 用 jq 数字符（与 API 的 body 长度口径一致），不要用 wc -m（受 locale 影响会数成字节）
            FILE_LEN=$(jq -R -s 'length' < "$FILE")
            echo "Release notes file length: $FILE_LEN (characters)"
            if [ "$BODY_LEN" -lt $((FILE_LEN / 2)) ]; then
              echo "::error::Release 正文疑似没有更新（$BODY_LEN 字符，发布说明 $FILE_LEN 字符）"
              exit 1
            fi
          fi
          gh release view "$TAG" --json tagName,name,url -q '"Release " + .tagName + " (" + .name + ") " + .url'
